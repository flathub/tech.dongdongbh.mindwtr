id: tech.dongdongbh.mindwtr
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: mindwtr
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network

modules:
  - name: mindwtr
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        CARGO_HOME: /run/build/mindwtr/cargo
        CARGO_NET_OFFLINE: 'true'
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        XDG_CACHE_HOME: /run/build/mindwtr/flatpak-node/cache
        npm_config_cache: /run/build/mindwtr/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node22
        npm_config_offline: 'true'
        npm_config_audit: 'false'
        npm_config_fund: 'false'
        npm_config_update_notifier: 'false'
    build-commands:
      - |
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path
          from urllib.parse import quote


          def package_name_from_path(package_path: str) -> str | None:
              parts = Path(package_path).parts
              last_name = None
              i = 0
              while i < len(parts):
                  if parts[i] != "node_modules":
                      i += 1
                      continue
                  i += 1
                  if i >= len(parts):
                      break
                  name = parts[i]
                  if name.startswith("@") and i + 1 < len(parts):
                      name = f"{name}/{parts[i + 1]}"
                      i += 1
                  last_name = name
                  i += 1
              return last_name


          def tarball_url(package_name: str, version: str) -> str:
              encoded_name = quote(package_name, safe="@/")
              basename = package_name.split("/")[-1]
              return f"https://registry.npmjs.org/{encoded_name}/-/{basename}-{version}.tgz"


          def integrity_from_hex(hex_digest: str) -> str:
              return "sha512-" + base64.b64encode(bytes.fromhex(hex_digest)).decode()

          lock_path = Path("apps/desktop/package-lock.json")
          node_sources_path = Path("tech.dongdongbh.mindwtr.node-sources.json")
          lock = json.loads(lock_path.read_text())
          node_sources = json.loads(node_sources_path.read_text())
          packages = lock.get("packages", {})
          npm_sources = {
              entry["url"]: entry["sha512"]
              for entry in node_sources
              if isinstance(entry, dict)
              and isinstance(entry.get("url"), str)
              and entry["url"].startswith("https://registry.npmjs.org/")
              and isinstance(entry.get("sha512"), str)
          }
          repaired = []

          for package_path, meta in packages.items():
              if not isinstance(meta, dict) or not package_path.startswith("node_modules/") or meta.get("link"):
                  continue
              if "version" not in meta or ("resolved" in meta and "integrity" in meta):
                  continue

              package_name = package_name_from_path(package_path)
              version = meta.get("version")
              if not package_name or not version:
                  raise SystemExit(f"Could not derive npm package identity for {package_path}")

              resolved = tarball_url(package_name, version)
              sha512_hex = npm_sources.get(resolved)
              if not sha512_hex:
                  raise SystemExit(f"Missing npm cache metadata for {package_path} ({resolved})")

              meta["resolved"] = resolved
              meta["integrity"] = integrity_from_hex(sha512_hex)
              repaired.append(package_path)

          if repaired:
              lock_path.write_text(json.dumps(lock, indent=2) + "\n")
              print(f"Repaired package-lock metadata for {len(repaired)} nested package(s)")
          PY
      - npm ci --prefix=apps/desktop --offline --legacy-peer-deps --workspaces=false
      - ln -sfn ../../apps/desktop/node_modules packages/core/node_modules
      - cd apps/desktop && npm exec vite build
      - mkdir -p .cargo
      - cp cargo/config .cargo/config.toml
      - cargo --offline build --manifest-path apps/desktop/src-tauri/Cargo.toml --bins --features tauri/custom-protocol --release
      - install -Dm755 apps/desktop/src-tauri/target/release/mindwtr /app/bin/mindwtr
      - install -Dm644 apps/desktop/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/tech.dongdongbh.mindwtr.png
      - install -Dm644 apps/desktop/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/tech.dongdongbh.mindwtr.png
      - install -Dm644 apps/desktop/src-tauri/linux/tech.dongdongbh.mindwtr.desktop /app/share/applications/tech.dongdongbh.mindwtr.desktop
      - install -Dm644 apps/desktop/src-tauri/linux/Mindwtr.metainfo.xml /app/share/metainfo/tech.dongdongbh.mindwtr.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/tech.dongdongbh.mindwtr/LICENSE
    sources:
      - type: git
        url: https://github.com/dongdongbh/Mindwtr.git
        commit: deeefc827474bbabd1d58a4e13422590ad9026df
      - tech.dongdongbh.mindwtr.node-sources.json
      - tech.dongdongbh.mindwtr.cargo-sources.json
