id: tech.dongdongbh.mindwtr
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: mindwtr
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.gnome.evolution.dataserver.Calendar8
  - --talk-name=org.gnome.evolution.dataserver.Sources5
  - --talk-name=org.gnome.evolution.dataserver.Subprocess.Backend.*

modules:
  - name: libical
    cleanup:
      - /lib/cmake
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DSHARED_ONLY=true
      - -DICAL_BUILD_DOCS=false
      - -DICAL_GLIB=true
      - -DICAL_GLIB_VAPI=false
      - -DGOBJECT_INTROSPECTION=false
      - -DLIBICAL_BUILD_TESTING=false
      - -DWITH_CXX_BINDINGS=false
    sources:
      - type: archive
        url: https://github.com/libical/libical/releases/download/v3.0.20/libical-3.0.20.tar.gz
        sha256: e73de92f5a6ce84c1b00306446b290a2b08cdf0a80988eca0a2c9d5c3510b4c2
        x-checker-data:
          type: anitya
          project-id: 1637
          url-template: https://github.com/libical/libical/releases/download/v$version/libical-$version.tar.gz

  - name: evolution-data-server
    cleanup:
      - /lib/cmake
      - /lib/evolution-data-server/*-backends
      - /libexec
      - /share/dbus-1/services
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_CANBERRA=OFF
      - -DENABLE_DOT_LOCKING=OFF
      - -DENABLE_FILE_LOCKING=fcntl
      - -DENABLE_GOA=OFF
      - -DENABLE_GTK=OFF
      - -DENABLE_GTK4=OFF
      - -DENABLE_INTROSPECTION=OFF
      - -DENABLE_TESTS=OFF
      - -DENABLE_VALA_BINDINGS=OFF
      - -DENABLE_WEATHER=OFF
      - -DENABLE_INSTALLED_TESTS=OFF
      - -DENABLE_GTK_DOC=OFF
      - -DENABLE_EXAMPLES=OFF
      - -DENABLE_OAUTH2_WEBKITGTK=OFF
      - -DENABLE_OAUTH2_WEBKITGTK4=OFF
      - -DWITH_LIBDB=OFF
      - -DWITH_OPENLDAP=OFF
      - -DWITH_PHONENUMBER=OFF
    sources:
      - type: archive
        url: https://download.gnome.org/sources/evolution-data-server/3.60/evolution-data-server-3.60.2.tar.xz
        sha256: 2084dbdac396371b365d504c1ff45866ba8dca2f1252e5da1d3d9c33abdc1286
        x-checker-data:
          type: gnome
          name: evolution-data-server
          version-scheme: odd-minor-is-unstable
    modules:
      - shared-modules/intltool/intltool-0.51.json

  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: mindwtr
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        - VITE_DONATION_PROMPT_ENABLED=true
        - VITE_DROPBOX_APP_KEY=7ob82zg0lx0arkp
        - VITE_ANALYTICS_HEARTBEAT_URL=https://analytics.mindwtr.app/
        - CARGO_HOME=/run/build/mindwtr/cargo
        - CARGO_NET_OFFLINE=true
        - LIBCLANG_PATH=/usr/lib/sdk/llvm20/lib
        - XDG_CACHE_HOME=/run/build/mindwtr/flatpak-node/cache
        - npm_config_cache=/run/build/mindwtr/flatpak-node/npm-cache
        - npm_config_nodedir=/usr/lib/sdk/node22
        - npm_config_offline=true
        - npm_config_audit=false
        - npm_config_fund=false
        - npm_config_update_notifier=false
        - VITE_ANALYTICS_RELEASE_VERSION=v1.2.0
    build-commands:
      - |
          python3 - <<'PY'
          import json
          from pathlib import Path

          lock_path = Path("apps/desktop/package-lock.json")
          package_path = Path("apps/desktop/package.json")
          lock = json.loads(lock_path.read_text())
          package = json.loads(package_path.read_text())
          packages = lock.get("packages", {})
          lock_package_path = "node_modules/eslint/node_modules/escape-string-regexp"
          meta = packages.get(lock_package_path)
          if not isinstance(meta, dict) or meta.get("version") != "4.0.0":
              raise SystemExit(f"Unexpected package-lock entry at {lock_package_path}")

          changed = False
          if not meta.get("resolved"):
              meta["resolved"] = "https://registry.npmjs.org/escape-string-regexp/-/escape-string-regexp-4.0.0.tgz"
              changed = True
          if not meta.get("integrity"):
              meta["integrity"] = "sha512-TtpcNJ3XAzx3Gq8sWRzJaVajRs0uVxA2YAkdb1jm2YkPz4G6egUFAyA3n5vtEIZefPk5Wa4UXbKuS5fKkJWdgA=="
              changed = True

          synced_specs = []
          for section_name in ("dependencies", "devDependencies", "optionalDependencies"):
              section = package.get(section_name)
              if not isinstance(section, dict):
                  continue
              for dependency_name, requested_spec in list(section.items()):
                  if not isinstance(requested_spec, str):
                      continue
                  if requested_spec.startswith(("file:", "workspace:", "git+", "github:", "http:", "https:", "link:", "npm:")):
                      continue
                  locked = packages.get(f"node_modules/{dependency_name}")
                  locked_version = locked.get("version") if isinstance(locked, dict) else None
                  if not isinstance(locked_version, str) or not locked_version:
                      continue
                  if requested_spec == locked_version:
                      continue
                  section[dependency_name] = locked_version
                  synced_specs.append(f"{section_name}:{dependency_name}:{requested_spec}->{locked_version}")

          if changed:
              lock_path.write_text(json.dumps(lock, indent=2) + "\n")
              print(f"Repaired package-lock metadata for {lock_package_path}")
          if synced_specs:
              package_path.write_text(json.dumps(package, indent=2) + "\n")
              print("Aligned package.json specs to package-lock:")
              for item in synced_specs:
                  print(f"  - {item}")
          PY
      - mkdir -p .flatpak-core-install
      - cp packages/core/package.json packages/core/package-lock.json .flatpak-core-install/
      - npm ci --prefix=.flatpak-core-install --offline --legacy-peer-deps --workspaces=false
      - rm -rf packages/core/node_modules
      - mv .flatpak-core-install/node_modules packages/core/node_modules
      - npm ci --prefix=apps/desktop --offline --legacy-peer-deps --workspaces=false
      - cd apps/desktop && npm exec vite build
      - mkdir -p .cargo
      - cp cargo/config .cargo/config.toml
      - cargo --offline build --manifest-path apps/desktop/src-tauri/Cargo.toml --bins --features tauri/custom-protocol --release
      - install -Dm755 apps/desktop/src-tauri/target/release/mindwtr /app/bin/mindwtr
      - install -Dm644 apps/desktop/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/tech.dongdongbh.mindwtr.png
      - install -Dm644 apps/desktop/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/tech.dongdongbh.mindwtr.png
      - install -Dm644 apps/desktop/src-tauri/linux/tech.dongdongbh.mindwtr.desktop /app/share/applications/tech.dongdongbh.mindwtr.desktop
      - install -Dm644 apps/desktop/src-tauri/linux/Mindwtr.metainfo.xml /app/share/metainfo/tech.dongdongbh.mindwtr.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/tech.dongdongbh.mindwtr/LICENSE
    sources:
      - type: git
        url: https://github.com/dongdongbh/Mindwtr.git
        commit: 0452c57ae0feceb6a8353f5397ba227b81f65941
      - tech.dongdongbh.mindwtr.node-sources.json
      - tech.dongdongbh.mindwtr.cargo-sources.json
