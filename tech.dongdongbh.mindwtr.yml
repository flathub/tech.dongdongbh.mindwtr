id: tech.dongdongbh.mindwtr
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: mindwtr
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network

modules:
  - name: mindwtr
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        CARGO_HOME: /run/build/mindwtr/cargo
        CARGO_NET_OFFLINE: 'true'
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        XDG_CACHE_HOME: /run/build/mindwtr/flatpak-node/cache
        npm_config_cache: /run/build/mindwtr/flatpak-node/npm-cache
        npm_config_nodedir: /usr/lib/sdk/node22
        npm_config_offline: 'true'
        npm_config_audit: 'false'
        npm_config_fund: 'false'
        npm_config_update_notifier: 'false'
    build-commands:
      - |
          python3 - <<'PY'
          import json
          from pathlib import Path

          lock_path = Path("apps/desktop/package-lock.json")
          lock = json.loads(lock_path.read_text())
          packages = lock.get("packages", {})
          package_path = "node_modules/eslint/node_modules/escape-string-regexp"
          meta = packages.get(package_path)
          if not isinstance(meta, dict) or meta.get("version") != "4.0.0":
              raise SystemExit(f"Unexpected package-lock entry at {package_path}")

          changed = False
          if not meta.get("resolved"):
              meta["resolved"] = "https://registry.npmjs.org/escape-string-regexp/-/escape-string-regexp-4.0.0.tgz"
              changed = True
          if not meta.get("integrity"):
              meta["integrity"] = "sha512-TtpcNJ3XAzx3Gq8sWRzJaVajRs0uVxA2YAkdb1jm2YkPz4G6egUFAyA3n5vtEIZefPk5Wa4UXbKuS5fKkJWdgA=="
              changed = True

          if changed:
              lock_path.write_text(json.dumps(lock, indent=2) + "\n")
              print(f"Repaired package-lock metadata for {package_path}")
          PY
      - npm ci --prefix=apps/desktop --offline --legacy-peer-deps --workspaces=false
      - ln -sfn ../../apps/desktop/node_modules packages/core/node_modules
      - cd apps/desktop && npm exec vite build
      - mkdir -p .cargo
      - cp cargo/config .cargo/config.toml
      - cargo --offline build --manifest-path apps/desktop/src-tauri/Cargo.toml --bins --features tauri/custom-protocol --release
      - install -Dm755 apps/desktop/src-tauri/target/release/mindwtr /app/bin/mindwtr
      - install -Dm644 apps/desktop/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/tech.dongdongbh.mindwtr.png
      - install -Dm644 apps/desktop/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/tech.dongdongbh.mindwtr.png
      - install -Dm644 apps/desktop/src-tauri/linux/tech.dongdongbh.mindwtr.desktop /app/share/applications/tech.dongdongbh.mindwtr.desktop
      - install -Dm644 apps/desktop/src-tauri/linux/Mindwtr.metainfo.xml /app/share/metainfo/tech.dongdongbh.mindwtr.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/tech.dongdongbh.mindwtr/LICENSE
    sources:
      - type: git
        url: https://github.com/dongdongbh/Mindwtr.git
        commit: e185fe6b804235be2418e6c55c27ca1d0cbe23d5
      - tech.dongdongbh.mindwtr.node-sources.json
      - tech.dongdongbh.mindwtr.cargo-sources.json
